<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine Studio 3D — Full Game Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #121215; color: #d1d1e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { height: 45px; background: #1a1a20; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2a2a35; }
    .tool-group { display: flex; gap: 8px; align-items: center; }
    .btn { background: #2a2a35; border: 1px solid #3a3a48; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: #3a3a48; }
    .btn-play { background: #16a34a; border-color: #22c55e; }
    .btn-play:hover { background: #15803d; }
    .btn-stop { background: #dc2626; border-color: #ef4444; display: none; }

    .main-workspace { flex: 1; display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: 1fr 180px; height: calc(100vh - 45px); }

    .panel { background: #18181f; border: 1px solid #282833; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { background: #20202a; padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #282833; color: #8a8a9e; display: flex; justify-content: space-between; }

    #left-sidebar { grid-column: 1; grid-row: 1 / span 2; border-right: 1px solid #282833; }
    .tree-view, .asset-list { flex: 1; padding: 8px; overflow-y: auto; font-size: 13px; }
    .tree-item { padding: 4px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .tree-item:hover, .tree-item.selected { background: #2b2b3d; color: #fff; }

    #viewport-panel { grid-column: 2; grid-row: 1; position: relative; background: #000; }
    #canvas-container { width: 100%; height: 100%; }

    #right-sidebar { grid-column: 3; grid-row: 1 / span 2; border-left: 1px solid #282833; }
    .prop-group { padding: 12px; border-bottom: 1px solid #252530; }
    .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    .prop-row input, .prop-row select { background: #101014; border: 1px solid #2e2e3d; color: #fff; padding: 4px 6px; border-radius: 4px; width: 60%; font-size: 12px; }

    #bottom-panel { grid-column: 2; grid-row: 2; border-top: 1px solid #282833; }
    #code-editor { width: 100%; height: 100%; background: #0d0d11; color: #38bdf8; font-family: monospace; padding: 10px; border: none; outline: none; resize: none; font-size: 13px; }

    #file-input { display: none; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>

  <header>
    <div class="tool-group">
      <button class="btn" id="btn-add-cube">📦 Cube</button>
      <button class="btn" id="btn-add-char">👤 Personnage</button>
      <button class="btn" id="btn-import-trigger">📂 Importer .GLTF / .GLB</button>
      <input type="file" id="file-input" accept=".gltf,.glb">
    </div>
    
    <div class="tool-group">
      <button class="btn btn-play" id="btn-play">▶ JOUER</button>
      <button class="btn btn-stop" id="btn-stop">◼ STOP</button>
    </div>

    <div class="tool-group">
      <span style="font-size: 12px; color: #6b7280;">Mode : <strong id="engine-status" style="color: #38bdf8;">Édition</strong></span>
    </div>
  </header>

  <div class="main-workspace">
    
    <div class="panel" id="left-sidebar">
      <div class="panel-header">Hiérarchie du Jeu</div>
      <div class="tree-view" id="scene-tree"></div>
      <div class="panel-header">Assets</div>
      <div class="asset-list">
        <div class="tree-item">📜 PlayerControls.js</div>
        <div class="tree-item">🌍 MainPhysicsWorld</div>
      </div>
    </div>

    <div class="panel" id="viewport-panel">
      <div id="canvas-container"></div>
    </div>

    <div class="panel" id="right-sidebar">
      <div class="panel-header">Inspecteur</div>
      <div class="prop-group">
        <div class="prop-row"><label>Nom :</label><input type="text" id="obj-name" value="-"></div>
        <div class="prop-row"><label>Position X :</label><input type="number" id="pos-x" step="0.5" value="0"></div>
        <div class="prop-row"><label>Position Y :</label><input type="number" id="pos-y" step="0.5" value="0"></div>
        <div class="prop-row"><label>Position Z :</label><input type="number" id="pos-z" step="0.5" value="0"></div>
      </div>
      <div class="prop-group">
        <div class="panel-header" style="padding: 0 0 8px 0; background: none;">Physique (Cannon.js)</div>
        <div class="prop-row">
          <label>Type Physique :</label>
          <select id="rigidbody-type">
            <option value="dynamic">Dynamique (Sujet à la gravité)</option>
            <option value="static">Statique (Décor / Sol)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel" id="bottom-panel">
      <div class="panel-header">Console & Contrôles en jeu (ZQSD / Flèches + Espace pour Sauter)</div>
      <textarea id="code-editor" readonly spellcheck="false">// Contrôles actifs en mode PLAY :
// [Z / W / Flèche Haut] : Avancer
// [S / Flèche Bas]      : Reculer
// [Q / A / Flèche Gauche]: Pivoter Gauche
// [D / Flèche Droite]  : Pivoter Droite
// [Espace]              : Sauter (Physique Cannon.js)</textarea>
    </div>

  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as CANNON from 'cannon-es';

    // 1. MOTEUR PHYSIQUE (CANNON-ES)
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
    const physicsBodies = []; // Liaison [Mesh Three.js, Body Cannon.js]

    // Sol physique
    const groundBody = new CANNON.Body({
      type: CANNON.Body.STATIC,
      shape: new CANNON.Plane()
    });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // 2. MOTEUR GRAPHIQUE (THREE.JS)
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121215);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x3b82f6, 0x282833);
    scene.add(grid);

    // Contrôles Éditeur
    const orbit = new OrbitControls(camera, renderer.domElement);
    const transform = new TransformControls(camera, renderer.domElement);
    scene.add(transform);
    transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    // 3. GESTION DES OBJETS ET CHARGEMENT GLTF
    const gameObjects = [];
    let selectedObject = null;
    let playerMesh = null;
    let playerBody = null;

    const gltfLoader = new GLTFLoader();

    function addGameObject(name, mesh, bodyType = 'dynamic', isPlayer = false) {
      mesh.name = name;
      scene.add(mesh);
      gameObjects.push(mesh);

      // Création du corps physique Cannon.js
      const shape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5));
      const body = new CANNON.Body({
        mass: bodyType === 'dynamic' ? 1 : 0,
        shape: shape
      });
      body.position.copy(mesh.position);
      world.addBody(body);

      physicsBodies.push({ mesh, body, isPlayer });

      if (isPlayer) {
        playerMesh = mesh;
        playerBody = body;
        playerBody.fixedRotation = true; // Empêche le personnage de basculer
        playerBody.updateMassProperties();
      }

      transform.attach(mesh);
      selectedObject = mesh;
      updateSceneTree();
      updateInspector();
    }

    // Bouton Ajout Cube
    document.getElementById('btn-add-cube').addEventListener('click', () => {
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
      );
      cube.position.set(Math.random() * 2 - 1, 3, Math.random() * 2 - 1);
      addGameObject(`Cube_${gameObjects.length + 1}`, cube, 'dynamic');
    });

    // Bouton Ajout Personnage Joueur
    document.getElementById('btn-add-char').addEventListener('click', () => {
      const charGroup = new THREE.Group();
      const bodyMesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.4, 0.8, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0xef4444 })
      );
      bodyMesh.position.y = 0.8;
      charGroup.add(bodyMesh);
      charGroup.position.set(0, 2, 0);
      addGameObject(`Player_Character`, charGroup, 'dynamic', true);
    });

    // Importateur de fichier .GLTF / .GLB (1)
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-import-trigger').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      gltfLoader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 2, 0);
        addGameObject(file.name.replace(/\.[^/.]+$/, ""), model, 'dynamic');
      });
    });

    // 4. CAMÉRA 3ÈME PERSONNE & DÉPLACEMENT (2 & 3)
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    let isPlaying = false;
    const btnPlay = document.getElementById('btn-play');
    const btnStop = document.getElementById('btn-stop');
    const statusText = document.getElementById('engine-status');

    btnPlay.addEventListener('click', () => {
      isPlaying = true;
      transform.detach();
      orbit.enabled = false;
      btnPlay.style.display = 'none';
      btnStop.style.display = 'flex';
      statusText.innerText = 'EN JEU (Test)';
      statusText.style.color = '#22c55e';
    });

    btnStop.addEventListener('click', () => {
      isPlaying = false;
      orbit.enabled = true;
      if (selectedObject) transform.attach(selectedObject);
      btnPlay.style.display = 'flex';
      btnStop.style.display = 'none';
      statusText.innerText = 'Édition';
      statusText.style.color = '#38bdf8';
    });

    function updatePlayerMovement() {
      if (!isPlaying || !playerBody) return;

      const speed = 5;
      let moveZ = 0;
      let rotateY = 0;

      if (keys['KeyW'] || keys['ArrowUp']) moveZ = -speed;
      if (keys['KeyS'] || keys['ArrowDown']) moveZ = speed;
      if (keys['KeyA'] || keys['ArrowLeft']) rotateY = 2;
      if (keys['KeyD'] || keys['ArrowRight']) rotateY = -2;

      // Rotation du joueur
      if (rotateY !== 0) {
        playerMesh.rotation.y += rotateY * 0.016;
        playerBody.quaternion.copy(playerMesh.quaternion);
      }

      // Avancer/Reculer selon l'orientation
      const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(playerMesh.quaternion);
      playerBody.velocity.x = forward.x * moveZ;
      playerBody.velocity.z = forward.z * moveZ;

      // Saut avec Physique
      if (keys['Space'] && Math.abs(playerBody.velocity.y) < 0.05) {
        playerBody.velocity.y = 6;
      }

      // Caméra 3ème Personne (Suit le joueur)
      const offset = new THREE.Vector3(0, 3, 5).applyQuaternion(playerMesh.quaternion);
      camera.position.copy(playerMesh.position).add(offset);
      camera.lookAt(playerMesh.position.clone().add(new THREE.Vector3(0, 1, 0)));
    }

    // 5. IHMs ET BOUCLE DE RENDU
    function updateSceneTree() {
      const tree = document.getElementById('scene-tree');
      tree.innerHTML = '';
      gameObjects.forEach((obj) => {
        const item = document.createElement('div');
        item.className = `tree-item ${obj === selectedObject ? 'selected' : ''}`;
        item.innerHTML = `🧊 ${obj.name}`;
        item.onclick = () => {
          if (isPlaying) return;
          selectedObject = obj;
          transform.attach(obj);
          updateSceneTree();
          updateInspector();
        };
        tree.appendChild(item);
      });
    }

    function updateInspector() {
      if (!selectedObject) return;
      document.getElementById('obj-name').value = selectedObject.name;
      document.getElementById('pos-x').value = selectedObject.position.x.toFixed(1);
      document.getElementById('pos-y').value = selectedObject.position.y.toFixed(1);
      document.getElementById('pos-z').value = selectedObject.position.z.toFixed(1);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isPlaying) {
        // Avancer la physique Cannon.js
        world.step(1 / 60, delta, 3);
        
        // Synchro Mesh 3D avec les positions physiques Cannon.js
        physicsBodies.forEach(({ mesh, body }) => {
          mesh.position.copy(body.position);
          mesh.quaternion.copy(body.quaternion);
        });

        updatePlayerMovement();
      } else {
        // Synchro inverse quand l'utilisateur déplace un objet au Gizmo en édition
        physicsBodies.forEach(({ mesh, body }) => {
          body.position.copy(mesh.position);
          body.quaternion.copy(mesh.quaternion);
        });
        orbit.update();
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
  </html>

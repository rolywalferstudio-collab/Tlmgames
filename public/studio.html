<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blocks Studio 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', 'Segoe UI', sans-serif; }
        body { display: flex; height: 100vh; background: #0984e3; color: white; overflow: hidden; }

        /* Left Blocks Palette */
        #blocks-palette {
            width: 220px;
            background: #2d3436;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-right: 3px solid #636e72;
        }
        .palette-title { font-weight: bold; font-size: 1.1em; color: #ffeaa7; margin-bottom: 5px; }
        .block-btn {
            background: #0984e3;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 0 #095088;
        }
        .block-btn:hover { background: #74b9ff; }
        .block-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #095088; }

        #viewport { flex: 1; height: 100%; position: relative; }
        
        .toolbar {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 10px;
            background: rgba(45, 52, 54, 0.9);
            padding: 8px 12px;
            border-radius: 10px;
            z-index: 10;
        }

        button, .btn-label {
            background: #00b894;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 3px 0 #008f72;
        }
        button:hover { background: #55efc4; }
        button.danger { background: #d63031; box-shadow: 0 3px 0 #962323; }
        button.publish { background: #e17055; box-shadow: 0 3px 0 #b34a34; }

        #sidebar {
            width: 260px;
            background: #2d3436;
            border-left: 3px solid #636e72;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .prop-row { display: flex; justify-content: space-between; align-items: center; }
        .prop-row input { width: 90px; padding: 4px; background: #636e72; border: none; color: white; border-radius: 4px; }

        #blocklyModal {
            display: none;
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background: #2d3436;
            z-index: 100;
            border-radius: 12px;
            padding: 15px;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- Palette de Blocs Beach -->
    <div id="blocks-palette">
        <div class="palette-title">🧱 Blocs</div>
        <button class="block-btn" onclick="addBlock('box', 0xfdcb6e)">🟨 Cube Jaune</button>
        <button class="block-btn" style="background:#00b894;" onclick="addBlock('box', 0x00b894)">🟩 Cube Vert</button>
        <button class="block-btn" style="background:#e17055;" onclick="addBlock('box', 0xe17055)">🟥 Cube Rouge</button>
        <button class="block-btn" style="background:#0984e3;" onclick="addBlock('slab', 0x74b9ff)">🟦 Dalle Bleue</button>
        <button class="block-btn" style="background:#a29bfe;" onclick="addBlock('cylinder', 0xa29bfe)">🟣 Cylindre</button>
    </div>

    <div id="viewport">
        <div class="toolbar">
            <label class="btn-label" style="background:#6c5ce7;">
                📂 Importer Modèle
                <input type="file" id="importModelInput" accept=".glb,.gltf" style="display:none;">
            </label>
            <button id="openScriptBtn" style="background:#e67e22;">🧩 Script</button>
            <button id="playBtn">▶ Test Joueur</button>
            <button id="publishBtn" class="publish">🚀 Publier (Modération)</button>
            <button id="deleteBtn" class="danger">🗑 Supprimer</button>
        </div>
    </div>

    <div id="sidebar">
        <div style="font-weight:bold; color:#ffeaa7;">Inspecteur</div>
        <div id="noSelection" style="color:#aaa;">Sélectionne un bloc.</div>

        <div id="inspector" style="display: none; flex-direction:column; gap:10px;">
            <div class="prop-row"><label>Couleur</label><input type="color" id="propColor"></div>
            <div class="prop-row"><label>Fixe (Ancré)</label><input type="checkbox" id="propAnchored" style="width:auto;"></div>
            <div class="prop-row"><label>Pos X</label><input type="number" step="0.5" id="posX"></div>
            <div class="prop-row"><label>Pos Y</label><input type="number" step="0.5" id="posY"></div>
            <div class="prop-row"><label>Pos Z</label><input type="number" step="0.5" id="posZ"></div>
        </div>
    </div>

    <div id="blocklyModal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3>Éditeur Blockly</h3>
            <div>
                <button id="saveScriptBtn">💾 Sauvegarder</button>
                <button id="closeScriptBtn" class="danger">❌ Fermer</button>
            </div>
        </div>
        <div id="blocklyDiv" style="height: calc(100% - 50px); width: 100%;"></div>
    </div>

    <script type="module">
        import { TLMEngine } from './tlm-engine.js';
        import * as Blockly from 'https://unpkg.com/blockly/blockly.mjs';

        const container = document.getElementById('viewport');
        const engine = new TLMEngine(container);
        engine.start();

        // Sol style Plage / Sable
        engine.createPart({ shapeType: 'box', size: [50, 1, 50], position: [0, -0.5, 0], color: 0xffeaa7, anchored: true });

        window.addBlock = (shapeType, color) => {
            engine.createPart({ shapeType, position: [0, 5, 0], color, anchored: false });
        };

        const inspector = document.getElementById('inspector');
        const noSelection = document.getElementById('noSelection');

        engine.onSelect((obj) => {
            if (!obj) {
                inspector.style.display = 'none';
                noSelection.style.display = 'block';
                return;
            }

            noSelection.style.display = 'none';
            inspector.style.display = 'flex';

            if (obj.mesh.material?.color) {
                document.getElementById('propColor').value = '#' + obj.mesh.material.color.getHexString();
            }
            document.getElementById('propAnchored').checked = obj.anchored;
            document.getElementById('posX').value = obj.mesh.position.x;
            document.getElementById('posY').value = obj.mesh.position.y;
            document.getElementById('posZ').value = obj.mesh.position.z;
        });

        document.getElementById('propColor').addEventListener('input', (e) => engine.updateSelectedProperty('color', e.target.value));
        document.getElementById('propAnchored').addEventListener('change', (e) => engine.updateSelectedProperty('anchored', e.target.checked));
        ['posX', 'posY', 'posZ'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => engine.updateSelectedProperty(`position.${id.slice(-1).toLowerCase()}`, e.target.value));
        });

        document.getElementById('deleteBtn').onclick = () => engine.deleteSelected();

        document.getElementById('importModelInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) engine.loadGLTFModel(URL.createObjectURL(file), [0, 2, 0]);
        });

        const playBtn = document.getElementById('playBtn');
        playBtn.onclick = () => {
            const isPlaying = engine.togglePlayMode();
            playBtn.innerText = isPlaying ? '⏹ Stop' : '▶ Test Joueur';
        };

        // Envoi pour Modération
        document.getElementById('publishBtn').onclick = async () => {
            const mapData = engine.exportScene();
            
            try {
                const res = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: "Ma Carte Blocks", data: mapData })
                });
                
                if (res.ok) {
                    alert("🎉 Carte envoyée avec succès ! Elle est désormais en cours de vérification par la modération.");
                } else {
                    alert("Succès local : Votre carte a été générée. (Serveur backend de modération en attente de déploiement)");
                }
            } catch (err) {
                alert("Votre carte est prête et a été validée localement pour la modération !");
            }
        };

        let workspace = null;
        const blocklyModal = document.getElementById('blocklyModal');

        document.getElementById('openScriptBtn').onclick = () => {
            if (!engine.selectedObject) return alert("Sélectionne un bloc d'abord !");
            blocklyModal.style.display = 'flex';
            if (!workspace) {
                workspace = Blockly.inject('blocklyDiv', {
                    toolbox: `<xml><block type="controls_if"></block><block type="math_number"></block></xml>`
                });
            }
        };

        document.getElementById('closeScriptBtn').onclick = () => blocklyModal.style.display = 'none';
        document.getElementById('saveScriptBtn').onclick = () => {
            if (engine.selectedObject) engine.selectedObject.script = "active";
            blocklyModal.style.display = 'none';
        };
    </script>
</body>
                                                          </html>

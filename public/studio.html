<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLMGAMES Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #18181f; color: #e1e1e6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header Blockbench Style */
    header { height: 42px; background: #202028; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #2d2d38; z-index: 10; }
    .nav-group { display: flex; gap: 6px; align-items: center; }
    .btn-icon { background: transparent; border: none; color: #a0a0b0; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
    .btn-icon:hover { background: #2d2d3d; color: #fff; }
    .btn-icon.active { background: #3b82f6; color: #fff; }
    .btn-play { background: #16a34a; color: white; }
    .btn-play:hover { background: #15803d; }
    .btn-stop { background: #dc2626; color: white; display: none; }

    /* Layout principal Blockbench */
    .workspace { flex: 1; display: grid; grid-template-columns: 220px 1fr 250px; grid-template-rows: 1fr 140px; height: calc(100vh - 78px); }

    .panel { background: #202028; border: 1px solid #2d2d38; display: flex; flex-direction: column; overflow: hidden; }
    .panel-title { background: #18181f; padding: 6px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #8a8a9a; border-bottom: 1px solid #2d2d38; display: flex; justify-content: space-between; }

    /* Gauche : Outliner / Hiérarchie */
    #left-panel { grid-column: 1; grid-row: 1 / span 2; }
    .tree-list { flex: 1; overflow-y: auto; padding: 6px; font-size: 12px; }
    .tree-item { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; color: #a0a0b0; }
    .tree-item:hover, .tree-item.selected { background: #2d2d3d; color: #fff; }

    /* Centre : Canvas 3D Blockbench */
    #viewport { grid-column: 2; grid-row: 1; position: relative; background: #18181f; }
    #canvas-container { width: 100%; height: 100%; }

    /* Gizmo Toolbar à droite de la vue 3D */
    .toolbar-gizmo { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; background: #202028; padding: 4px; border-radius: 6px; border: 1px solid #2d2d38; z-index: 5; }
    .toolbar-gizmo .btn-icon { width: 32px; height: 32px; justify-content: center; padding: 0; }

    /* Droite : Propriétés / Inspecteur */
    #right-panel { grid-column: 3; grid-row: 1 / span 2; }
    .prop-group { padding: 10px; border-bottom: 1px solid #2d2d38; }
    .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; }
    .prop-row input, .prop-row select { background: #121216; border: 1px solid #2d2d38; color: #fff; padding: 3px 6px; border-radius: 4px; width: 60%; font-size: 11px; text-align: center; }

    /* Bas : Console & Scripting */
    #bottom-panel { grid-column: 2; grid-row: 2; border-top: 1px solid #2d2d38; }
    #code-editor { width: 100%; height: 100%; background: #121216; color: #38bdf8; font-family: monospace; padding: 8px; border: none; outline: none; resize: none; font-size: 12px; }

    /* Footer Status Bar Blockbench */
    footer { height: 36px; background: #202028; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-top: 1px solid #2d2d38; font-size: 11px; z-index: 10; }
    .coords-inputs { display: flex; gap: 10px; align-items: center; color: #8a8a9a; }
    .coord-item { display: flex; align-items: center; gap: 4px; }
    .coord-item span { font-weight: bold; }

    #file-input { display: none; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>

  <!-- Header Style Blockbench -->
  <header>
    <div class="nav-group">
      <button class="btn-icon">☰</button>
      <button class="btn-icon" id="btn-add-cube">🧊 Cube</button>
      <button class="btn-icon" id="btn-add-player">👤 Joueur</button>
      <button class="btn-icon" id="btn-import">📂 Importer .GLB</button>
      <input type="file" id="file-input" accept=".gltf,.glb">
    </div>

    <div class="nav-group">
      <button class="btn-icon btn-play" id="btn-play">▶ JOUER</button>
      <button class="btn-icon btn-stop" id="btn-stop">◼ STOP</button>
    </div>

    <div class="nav-group">
      <span style="font-size: 11px; color: #8a8a9a;">Mode : <strong id="status-mode" style="color: #3b82f6;">Édition</strong></span>
    </div>
  </header>

  <!-- Section principale -->
  <div class="workspace">
    
    <!-- Gauche : Outliner -->
    <div class="panel" id="left-panel">
      <div class="panel-title">Outliner / Éléments</div>
      <div class="tree-list" id="scene-tree"></div>
    </div>

    <!-- Centre : Viewport 3D -->
    <div class="panel" id="viewport">
      <div id="canvas-container"></div>
      
      <div class="toolbar-gizmo">
        <button class="btn-icon active" id="tool-translate" title="Déplacer (G)">⤭</button>
        <button class="btn-icon" id="tool-rotate" title="Pivoter (R)">🔄</button>
        <button class="btn-icon" id="tool-scale" title="Redimensionner (S)">⤢</button>
      </div>
    </div>

    <!-- Droite : Inspecteur / Propriétés Blockbench -->
    <div class="panel" id="right-panel">
      <div class="panel-title">Element / Propriétés</div>
      <div class="prop-group">
        <div class="prop-row"><label>Nom :</label><input type="text" id="prop-name" value="-"></div>
        <div class="prop-row"><label>Position X :</label><input type="number" id="prop-x" step="0.5" value="0"></div>
        <div class="prop-row"><label>Position Y :</label><input type="number" id="prop-y" step="0.5" value="0"></div>
        <div class="prop-row"><label>Position Z :</label><input type="number" id="prop-z" step="0.5" value="0"></div>
      </div>
      <div class="prop-group">
        <div class="panel-title" style="padding:0 0 6px 0; background:none;">Physique & Collisions</div>
        <div class="prop-row">
          <label>RigidBody :</label>
          <select id="prop-physics">
            <option value="dynamic">Dynamique (Gravité)</option>
            <option value="static">Statique (Décor)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Bas : Console / Script -->
    <div class="panel" id="bottom-panel">
      <div class="panel-title">Script / Scripting Joueur</div>
      <textarea id="code-editor" readonly spellcheck="false">// Contrôles du joueur en mode JOUER :
// ZQSD / Flèches : Déplacements du personnage
// Espace : Sauter (Moteur physique Cannon.js active)
// La caméra suit le personnage en 3ème personne.</textarea>
    </div>

  </div>

  <!-- Footer Blockbench Coordonnées -->
  <footer>
    <div class="coords-inputs">
      <div class="coord-item"><span style="color:#f87171;">X</span><input type="text" id="pos-x" class="coord-box" value="0.0" readonly style="width:40px; background:#121216; border:1px solid #2d2d38; color:#fff; text-align:center; border-radius:3px;"></div>
      <div class="coord-item"><span style="color:#4ade80;">Y</span><input type="text" id="pos-y" class="coord-box" value="0.5" readonly style="width:40px; background:#121216; border:1px solid #2d2d38; color:#fff; text-align:center; border-radius:3px;"></div>
      <div class="coord-item"><span style="color:#60a5fa;">Z</span><input type="text" id="pos-z" class="coord-box" value="0.0" readonly style="width:40px; background:#121216; border:1px solid #2d2d38; color:#fff; text-align:center; border-radius:3px;"></div>
    </div>
    <span style="color: #6b7280;">Blockbench Engine — Three.js & Cannon.js</span>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as CANNON from 'cannon-es';

    // 1. CANNON.JS (PHYSIQUE)
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
    const physicsBodies = [];

    const groundBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // 2. THREE.JS SCÈNE & CAMÉRA
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18181f);

    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(5, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(16, 16, 0x4f4f6e, 0x2e2e3d);
    scene.add(grid);

    // 3. CONTRÔLES & GIZMO
    const orbit = new OrbitControls(camera, renderer.domElement);
    const transform = new TransformControls(camera, renderer.domElement);
    scene.add(transform);

    transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    // 4. OBJETS & IMPORTATION .GLB
    const gameObjects = [];
    let selectedObject = null;
    let playerMesh = null;
    let playerBody = null;

    const gltfLoader = new GLTFLoader();

    function addObject(name, mesh, bodyType = 'dynamic', isPlayer = false) {
      mesh.name = name;
      scene.add(mesh);
      gameObjects.push(mesh);

      const shape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5));
      const body = new CANNON.Body({ mass: bodyType === 'dynamic' ? 1 : 0, shape });
      body.position.copy(mesh.position);
      world.addBody(body);

      physicsBodies.push({ mesh, body, isPlayer });

      if (isPlayer) {
        playerMesh = mesh;
        playerBody = body;
        playerBody.fixedRotation = true;
        playerBody.updateMassProperties();
      }

      transform.attach(mesh);
      selectedObject = mesh;
      updateTree();
      updateInspector();
      return mesh;
    }

    // Premier cube par défaut Blockbench
    const initialCube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 })
    );
    initialCube.position.set(0, 0.5, 0);
    addObject('Cube_Base', initialCube, 'dynamic');

    // Ajouter Cube
    document.getElementById('btn-add-cube').addEventListener('click', () => {
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
      );
      cube.position.set(Math.random() * 2 - 1, 1, Math.random() * 2 - 1);
      addObject(`Cube_${gameObjects.length + 1}`, cube, 'dynamic');
    });

    // Ajouter Joueur
    document.getElementById('btn-add-player').addEventListener('click', () => {
      const group = new THREE.Group();
      const bodyMesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.4, 0.8, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0x22c55e })
      );
      bodyMesh.position.y = 0.8;
      group.add(bodyMesh);
      group.position.set(0, 2, 0);
      addObject('Player', group, 'dynamic', true);
    });

    // Importateur .GLB
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-import').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      gltfLoader.load(url, (gltf) => {
        const model = gltf.scene;
        model.position.set(0, 2, 0);
        addObject(file.name.replace(/\.[^/.]+$/, ""), model, 'dynamic');
      });
    });

    // 5. GESTION DES OUTILS GIZMO (G, R, S)
    const btnT = document.getElementById('tool-translate');
    const btnR = document.getElementById('tool-rotate');
    const btnS = document.getElementById('tool-scale');

    function setMode(mode, activeBtn) {
      transform.setMode(mode);
      [btnT, btnR, btnS].forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    btnT.addEventListener('click', () => setMode('translate', btnT));
    btnR.addEventListener('click', () => setMode('rotate', btnR));
    btnS.addEventListener('click', () => setMode('scale', btnS));

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'g') setMode('translate', btnT);
      if (e.key.toLowerCase() === 'r') setMode('rotate', btnR);
      if (e.key.toLowerCase() === 's') setMode('scale', btnS);
    });

    // 6. MODE PLAY & DEPLACEMENTS
    let isPlaying = false;
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    const btnPlay = document.getElementById('btn-play');
    const btnStop = document.getElementById('btn-stop');
    const statusText = document.getElementById('status-mode');

    btnPlay.addEventListener('click', () => {
      isPlaying = true;
      transform.detach();
      orbit.enabled = false;
      btnPlay.style.display = 'none';
      btnStop.style.display = 'flex';
      statusText.innerText = 'En Jeu';
      statusText.style.color = '#22c55e';
    });

    btnStop.addEventListener('click', () => {
      isPlaying = false;
      orbit.enabled = true;
      if (selectedObject) transform.attach(selectedObject);
      btnPlay.style.display = 'flex';
      btnStop.style.display = 'none';
      statusText.innerText = 'Édition';
      statusText.style.color = '#3b82f6';
    });

    function updatePlayer() {
      if (!isPlaying || !playerBody) return;

      const speed = 5;
      let moveZ = 0;
      let rotateY = 0;

      if (keys['KeyW'] || keys['ArrowUp']) moveZ = -speed;
      if (keys['KeyS'] || keys['ArrowDown']) moveZ = speed;
      if (keys['KeyA'] || keys['ArrowLeft']) rotateY = 2;
      if (keys['KeyD'] || keys['ArrowRight']) rotateY = -2;

      if (rotateY !== 0) {
        playerMesh.rotation.y += rotateY * 0.016;
        playerBody.quaternion.copy(playerMesh.quaternion);
      }

      const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(playerMesh.quaternion);
      playerBody.velocity.x = forward.x * moveZ;
      playerBody.velocity.z = forward.z * moveZ;

      if (keys['Space'] && Math.abs(playerBody.velocity.y) < 0.05) {
        playerBody.velocity.y = 6;
      }

      const offset = new THREE.Vector3(0, 3, 5).applyQuaternion(playerMesh.quaternion);
      camera.position.copy(playerMesh.position).add(offset);
      camera.lookAt(playerMesh.position.clone().add(new THREE.Vector3(0, 1, 0)));
    }

    // 7. INSPECTEUR & MISES À JOUR
    function updateTree() {
      const tree = document.getElementById('scene-tree');
      tree.innerHTML = '';
      gameObjects.forEach((obj) => {
        const item = document.createElement('div');
        item.className = `tree-item ${obj === selectedObject ? 'selected' : ''}`;
        item.innerHTML = `🧊 ${obj.name}`;
        item.onclick = () => {
          if (isPlaying) return;
          selectedObject = obj;
          transform.attach(obj);
          updateTree();
          updateInspector();
        };
        tree.appendChild(item);
      });
    }

    function updateInspector() {
      if (!selectedObject) return;
      const pos = selectedObject.position;
      document.getElementById('prop-name').value = selectedObject.name;
      document.getElementById('prop-x').value = pos.x.toFixed(1);
      document.getElementById('prop-y').value = pos.y.toFixed(1);
      document.getElementById('prop-z').value = pos.z.toFixed(1);

      document.getElementById('pos-x').value = pos.x.toFixed(1);
      document.getElementById('pos-y').value = pos.y.toFixed(1);
      document.getElementById('pos-z').value = pos.z.toFixed(1);
    }

    transform.addEventListener('change', updateInspector);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isPlaying) {
        world.step(1 / 60, delta, 3);
        physicsBodies.forEach(({ mesh, body }) => {
          mesh.position.copy(body.position);
          mesh.quaternion.copy(body.quaternion);
        });
        updatePlayer();
      } else {
        physicsBodies.forEach(({ mesh, body }) => {
          body.position.copy(mesh.position);
          body.quaternion.copy(mesh.quaternion);
        });
        orbit.update();
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
          </html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine Studio 3D — Game Creator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #121215; color: #d1d1e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Barre supérieure / Toolbar principal */
    header { height: 45px; background: #1a1a20; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2a2a35; }
    .tool-group { display: flex; gap: 8px; align-items: center; }
    .btn { background: #2a2a35; border: 1px solid #3a3a48; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: #3a3a48; }
    .btn-play { background: #16a34a; border-color: #22c55e; }
    .btn-play:hover { background: #15803d; }
    .btn-stop { background: #dc2626; border-color: #ef4444; display: none; }

    /* Structure Principale en Grille */
    .main-workspace { flex: 1; display: grid; grid-template-columns: 240px 1fr 280px; grid-template-rows: 1fr 200px; height: calc(100vh - 45px); }

    /* Panneaux */
    .panel { background: #18181f; border: 1px solid #282833; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { background: #20202a; padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #282833; color: #8a8a9e; display: flex; justify-content: space-between; }

    /* Gauche : Hiérarchie & Assets */
    #left-sidebar { grid-column: 1; grid-row: 1 / span 2; border-right: 1px solid #282833; }
    .tree-view, .asset-list { flex: 1; padding: 8px; overflow-y: auto; font-size: 13px; }
    .tree-item { padding: 4px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .tree-item:hover, .tree-item.selected { background: #2b2b3d; color: #fff; }

    /* Centre : Canvas 3D */
    #viewport-panel { grid-column: 2; grid-row: 1; position: relative; background: #000; }
    #canvas-container { width: 100%; height: 100%; }

    /* Droite : Inspecteur de propriétés */
    #right-sidebar { grid-column: 3; grid-row: 1 / span 2; border-left: 1px solid #282833; }
    .prop-group { padding: 12px; border-bottom: 1px solid #252530; }
    .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    .prop-row input, .prop-row select { background: #101014; border: 1px solid #2e2e3d; color: #fff; padding: 4px 6px; border-radius: 4px; width: 60%; font-size: 12px; }

    /* Bas : Éditeur de Code & Console */
    #bottom-panel { grid-column: 2; grid-row: 2; border-top: 1px solid #282833; }
    #code-editor { width: 100%; height: 100%; background: #0d0d11; color: #38bdf8; font-family: monospace; padding: 10px; border: none; outline: none; resize: none; font-size: 13px; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <header>
    <div class="tool-group">
      <button class="btn" id="btn-add-cube">📦 Cube</button>
      <button class="btn" id="btn-add-char">👤 Personnage</button>
      <button class="btn" id="btn-import-3d">📂 Importer .GLTF</button>
    </div>
    
    <!-- Contrôles de Test (Play / Stop) -->
    <div class="tool-group">
      <button class="btn btn-play" id="btn-play">▶ JOUER (Play)</button>
      <button class="btn btn-stop" id="btn-stop">◼ STOP</button>
    </div>

    <div class="tool-group">
      <span style="font-size: 12px; color: #6b7280;">Engine Mode : <strong id="engine-status" style="color: #38bdf8;">Édition</strong></span>
    </div>
  </header>

  <div class="main-workspace">
    
    <!-- Gauche : Hiérarchie de scène -->
    <div class="panel" id="left-sidebar">
      <div class="panel-header">Hiérarchie du Jeu</div>
      <div class="tree-view" id="scene-tree">
        <!-- Les objets apparaîtront ici -->
      </div>
      <div class="panel-header">Banque d'Assets</div>
      <div class="asset-list">
        <div class="tree-item">📜 PlayerScript.js</div>
        <div class="tree-item">🎨 Texture_Grass.png</div>
        <div class="tree-item">🔊 JumpSound.wav</div>
      </div>
    </div>

    <!-- Centre : Vue 3D -->
    <div class="panel" id="viewport-panel">
      <div id="canvas-container"></div>
    </div>

    <!-- Droite : Inspecteur -->
    <div class="panel" id="right-sidebar">
      <div class="panel-header">Inspecteur & Composants</div>
      <div class="prop-group">
        <div class="prop-row"><label>Nom :</label><input type="text" id="obj-name" value="Cube_01"></div>
        <div class="prop-row"><label>Position X :</label><input type="number" id="pos-x" step="0.5" value="0"></div>
        <div class="prop-row"><label>Position Y :</label><input type="number" id="pos-y" step="0.5" value="0.5"></div>
        <div class="prop-row"><label>Position Z :</label><input type="number" id="pos-z" step="0.5" value="0"></div>
      </div>
      <div class="prop-group">
        <div class="panel-header" style="padding: 0 0 8px 0; background: none;">Physique & Script</div>
        <div class="prop-row">
          <label>RigidBody :</label>
          <select id="rigidbody-type">
            <option>Statique (Décor)</option>
            <option>Dynamique (Joueur)</option>
          </select>
        </div>
        <div class="prop-row"><label>Script Attaché :</label><input type="text" value="PlayerScript.js"></div>
      </div>
    </div>

    <!-- Bas : Éditeur de Code Integré -->
    <div class="panel" id="bottom-panel">
      <div class="panel-header">Éditeur de Script (Comportement du Joueur)</div>
      <textarea id="code-editor" spellcheck="false">// Script attaché à l'objet sélectionné
function update(player, delta) {
  if (isKeyPressed('ArrowUp')) {
    player.position.z -= 5 * delta;
  }
  if (isKeyPressed('ArrowDown')) {
    player.position.z += 5 * delta;
  }
}</textarea>
    </div>

  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // 1. SCÈNE & CAMÉRA
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121215);

    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(6, 6, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Lumières & Sol
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x3b82f6, 0x282833);
    scene.add(grid);

    // Controls
    const orbit = new OrbitControls(camera, renderer.domElement);
    const transform = new TransformControls(camera, renderer.domElement);
    scene.add(transform);

    transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    // 2. GESTION DES OBJETS DU JEU
    const gameObjects = [];
    let selectedObject = null;

    function createGameObject(name, mesh) {
      mesh.name = name;
      scene.add(mesh);
      gameObjects.push(mesh);
      transform.attach(mesh);
      selectedObject = mesh;
      updateSceneTree();
      updateInspector();
    }

    // Ajouter un cube basique
    document.getElementById('btn-add-cube').addEventListener('click', () => {
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
      );
      cube.position.set(0, 0.5, 0);
      createGameObject(`Cube_${gameObjects.length + 1}`, cube);
    });

    // Ajouter un personnage (Capsule temporaire type Roblox)
    document.getElementById('btn-add-char').addEventListener('click', () => {
      const charGroup = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.4, 1, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0xef4444 })
      );
      body.position.y = 0.9;
      charGroup.add(body);
      createGameObject(`Player_Character`, charGroup);
    });

    // 3. MISE À JOUR D'INTERFACE (HIÉRARCHIE & INSPECTEUR)
    function updateSceneTree() {
      const tree = document.getElementById('scene-tree');
      tree.innerHTML = '';
      gameObjects.forEach((obj) => {
        const item = document.createElement('div');
        item.className = `tree-item ${obj === selectedObject ? 'selected' : ''}`;
        item.innerHTML = `🧊 ${obj.name}`;
        item.onclick = () => {
          selectedObject = obj;
          transform.attach(obj);
          updateSceneTree();
          updateInspector();
        };
        tree.appendChild(item);
      });
    }

    function updateInspector() {
      if (!selectedObject) return;
      document.getElementById('obj-name').value = selectedObject.name;
      document.getElementById('pos-x').value = selectedObject.position.x;
      document.getElementById('pos-y').value = selectedObject.position.y;
      document.getElementById('pos-z').value = selectedObject.position.z;
    }

    // 4. MODE PLAY / STOP (TEST DU JEU)
    let isPlaying = false;
    const btnPlay = document.getElementById('btn-play');
    const btnStop = document.getElementById('btn-stop');
    const statusText = document.getElementById('engine-status');

    btnPlay.addEventListener('click', () => {
      isPlaying = true;
      transform.detach();
      btnPlay.style.display = 'none';
      btnStop.style.display = 'flex';
      statusText.innerText = 'EN JEU (Test)';
      statusText.style.color = '#22c55e';
    });

    btnStop.addEventListener('click', () => {
      isPlaying = false;
      if (selectedObject) transform.attach(selectedObject);
      btnPlay.style.display = 'flex';
      btnStop.style.display = 'none';
      statusText.innerText = 'Édition';
      statusText.style.color = '#38bdf8';
    });

    // Boucle de rendu
    function animate() {
      requestAnimationFrame(animate);
      orbit.update();
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionnement de la fenêtre
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
                                                   </html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TLM Studio Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background: #1e1e1e; color: #ccc; overflow: hidden; }

        /* Left Browser Panel */
        #asset-browser {
            width: 240px;
            background: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
        }
        .browser-header { padding: 10px; background: #2d2d2d; font-weight: bold; border-bottom: 1px solid #3c3c3c; color: #fff; }
        .asset-grid { padding: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; overflow-y: auto; }
        .asset-card { background: #333; border: 1px solid #444; border-radius: 4px; padding: 10px; text-align: center; cursor: pointer; }
        .asset-card:hover { border-color: #0e639c; background: #3c3c3c; }
        .asset-card span { font-size: 0.8em; display: block; margin-top: 5px; color: #aaa; }

        /* Viewport */
        #viewport { flex: 1; height: 100%; position: relative; }
        
        .toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 8px;
            background: rgba(30, 30, 30, 0.85);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            z-index: 10;
        }

        button, .btn-label {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
        }
        button:hover, .btn-label:hover { background: #1177bb; }
        button.danger { background: #a12626; }
        button.danger:hover { background: #ce2e2e; }

        /* Right Inspector Panel */
        #sidebar {
            width: 280px;
            background: #252526;
            border-left: 1px solid #3c3c3c;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title { font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; border-bottom: 1px solid #3c3c3c; padding-bottom: 4px; color: #fff; }
        .prop-group { display: flex; flex-direction: column; gap: 8px; }
        .prop-row { display: flex; justify-content: space-between; align-items: center; }
        .prop-row label { font-size: 0.85em; color: #aaa; }
        .prop-row input { width: 100px; padding: 3px 6px; background: #1e1e1e; border: 1px solid #444; color: #fff; border-radius: 3px; font-size: 0.85em; }

        #blocklyModal {
            display: none;
            position: fixed;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background: #222;
            z-index: 100;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 15px;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <!-- Asset Browser à gauche (style Stingray / Unity / Unreal) -->
    <div id="asset-browser">
        <div class="browser-header">Project Assets</div>
        <div class="asset-grid">
            <div class="asset-card" onclick="createPrimitive('box', 0x00ff00)">
                🟩 <span>Cube Vert</span>
            </div>
            <div class="asset-card" onclick="createPrimitive('box', 0xff0000)">
                🟥 <span>Cube Rouge</span>
            </div>
            <div class="asset-card" onclick="createPrimitive('box', 0x0000ff)">
                🟦 <span>Cube Bleu</span>
            </div>
            <div class="asset-card" onclick="createPrimitive('box', 0xffff00)">
                🟨 <span>Cube Jaune</span>
            </div>
            <div class="asset-card" onclick="createPrimitive('sphere', 0xffffff)">
                ⚪ <span>Sphère</span>
            </div>
            <div class="asset-card" onclick="createPrimitive('ramp', 0xe74c3c)">
                🔺 <span>Rampe</span>
            </div>
        </div>
    </div>

    <!-- Zone Rendue 3D -->
    <div id="viewport">
        <div class="toolbar">
            <label class="btn-label" style="background:#6c5ce7;">
                📂 Import GLTF/GLB
                <input type="file" id="importModelInput" accept=".glb,.gltf" style="display:none;">
            </label>
            <button id="openScriptBtn" style="background:#e67e22;">🧩 Script Visual</button>
            <button id="playBtn" style="background:#28a745;">▶ Play</button>
            <button id="saveBtn">💾 Save Level</button>
            <button id="deleteBtn" class="danger">🗑 Delete</button>
        </div>
    </div>

    <!-- Inspector à droite -->
    <div id="sidebar">
        <div class="panel-title">Properties</div>
        <div id="noSelection" style="font-size: 0.85em; color: #888;">Select an entity in the viewport.</div>

        <div id="inspector" style="display: none;" class="prop-group">
            <div class="prop-row">
                <label>Color</label>
                <input type="color" id="propColor">
            </div>
            <div class="prop-row">
                <label>Static / Anchored</label>
                <input type="checkbox" id="propAnchored" style="width: auto;">
            </div>

            <div class="panel-title" style="margin-top: 10px;">Transform</div>
            <div class="prop-row"><label>Pos X</label><input type="number" step="0.5" id="posX"></div>
            <div class="prop-row"><label>Pos Y</label><input type="number" step="0.5" id="posY"></div>
            <div class="prop-row"><label>Pos Z</label><input type="number" step="0.5" id="posZ"></div>

            <div class="prop-row"><label>Rot X°</label><input type="number" step="5" id="rotX"></div>
            <div class="prop-row"><label>Rot Y°</label><input type="number" step="5" id="rotY"></div>
            <div class="prop-row"><label>Rot Z°</label><input type="number" step="5" id="rotZ"></div>

            <div class="prop-row"><label>Scale X</label><input type="number" step="0.1" id="scaleX"></div>
            <div class="prop-row"><label>Scale Y</label><input type="number" step="0.1" id="scaleY"></div>
            <div class="prop-row"><label>Scale Z</label><input type="number" step="0.1" id="scaleZ"></div>
        </div>
    </div>

    <!-- Modal Blockly -->
    <div id="blocklyModal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3>Blockly Scripting Engine</h3>
            <div>
                <button id="saveScriptBtn">💾 Save Script</button>
                <button id="closeScriptBtn" class="danger">❌ Close</button>
            </div>
        </div>
        <div id="blocklyDiv" style="height: calc(100% - 50px); width: 100%;"></div>
    </div>

    <script type="module">
        import { TLMEngine } from './tlm-engine.js';
        import * as Blockly from 'https://unpkg.com/blockly/blockly.mjs';

        const container = document.getElementById('viewport');
        const engine = new TLMEngine(container);
        engine.start();

        // Sol stylisé Toon
        engine.createPart({ size: [40, 1, 40], position: [0, -0.5, 0], color: 0x888888, anchored: true });

        window.createPrimitive = (type, color) => {
            engine.createPart({ type, position: [0, 4, 0], color, anchored: false });
        };

        const inspector = document.getElementById('inspector');
        const noSelection = document.getElementById('noSelection');

        engine.onSelect((obj) => {
            if (!obj) {
                inspector.style.display = 'none';
                noSelection.style.display = 'block';
                return;
            }

            noSelection.style.display = 'none';
            inspector.style.display = 'flex';

            if (obj.mesh.material?.color) {
                document.getElementById('propColor').value = '#' + obj.mesh.material.color.getHexString();
            }
            document.getElementById('propAnchored').checked = obj.anchored;

            document.getElementById('posX').value = obj.mesh.position.x;
            document.getElementById('posY').value = obj.mesh.position.y;
            document.getElementById('posZ').value = obj.mesh.position.z;

            document.getElementById('rotX').value = Math.round(obj.mesh.rotation.x * (180 / Math.PI));
            document.getElementById('rotY').value = Math.round(obj.mesh.rotation.y * (180 / Math.PI));
            document.getElementById('rotZ').value = Math.round(obj.mesh.rotation.z * (180 / Math.PI));

            document.getElementById('scaleX').value = obj.mesh.scale.x;
            document.getElementById('scaleY').value = obj.mesh.scale.y;
            document.getElementById('scaleZ').value = obj.mesh.scale.z;
        });

        document.getElementById('propColor').addEventListener('input', (e) => engine.updateSelectedProperty('color', e.target.value));
        document.getElementById('propAnchored').addEventListener('change', (e) => engine.updateSelectedProperty('anchored', e.target.checked));

        ['posX', 'posY', 'posZ'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => engine.updateSelectedProperty(`position.${id.slice(-1).toLowerCase()}`, e.target.value));
        });

        ['rotX', 'rotY', 'rotZ'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => engine.updateSelectedProperty(`rotation.${id.slice(-1).toLowerCase()}`, e.target.value));
        });

        ['scaleX', 'scaleY', 'scaleZ'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => engine.updateSelectedProperty(`scale.${id.slice(-1).toLowerCase()}`, e.target.value));
        });

        document.getElementById('deleteBtn').onclick = () => engine.deleteSelected();

        document.getElementById('importModelInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                engine.loadGLTFModel(url, [0, 2, 0]);
            }
        });

        const playBtn = document.getElementById('playBtn');
        playBtn.onclick = () => {
            const isPlaying = engine.togglePlayMode();
            playBtn.innerText = isPlaying ? '⏹ Stop' : '▶ Play';
            playBtn.style.background = isPlaying ? '#dc3545' : '#28a745';
        };

        document.getElementById('saveBtn').onclick = () => {
            console.log(engine.exportScene());
            alert("Level Data exported to browser console!");
        };

        let workspace = null;
        const blocklyModal = document.getElementById('blocklyModal');

        document.getElementById('openScriptBtn').onclick = () => {
            if (!engine.selectedObject) {
                alert("Select an object first!");
                return;
            }
            blocklyModal.style.display = 'flex';
            if (!workspace) {
                workspace = Blockly.inject('blocklyDiv', {
                    toolbox: `<xml><block type="controls_if"></block><block type="logic_compare"></block><block type="math_number"></block></xml>`
                });
            }
        };

        document.getElementById('closeScriptBtn').onclick = () => blocklyModal.style.display = 'none';
        document.getElementById('saveScriptBtn').onclick = () => {
            if (engine.selectedObject) engine.selectedObject.script = "active";
            blocklyModal.style.display = 'none';
        };
    </script>
</body>
    </html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — TLM Games</title>
<link rel="icon" href="games/royaumes-colonies/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d0a; --panel:#11150f; --panel-2:#161b13; --line:#2b3226;
    --gold:#c9a227; --gold-bright:#e8c96a; --parchment:#e9e0c6; --parchment-dim:#a8a48c;
    --crimson:#7a2020; --crimson-bright:#9c2b2b; --green-dim:#5b6b57;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--parchment); font-family:'Spectral',serif; min-height:100vh;}
  a{color:inherit;}

  header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
    border-bottom:1px solid var(--line); background:rgba(10,13,10,0.9);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:28px;height:28px; background:linear-gradient(160deg,var(--gold-bright),var(--gold) 60%,#8a6c14); clip-path:polygon(50% 0%, 100% 22%, 100% 62%, 50% 100%, 0% 62%, 0% 22%);}
  .brand-name{font-family:'Cinzel',serif; font-weight:700; letter-spacing:3px; font-size:16px;}
  header a.back{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--parchment-dim); text-decoration:none; border:1px solid var(--line); padding:8px 14px;}
  header a.back:hover{color:var(--gold-bright); border-color:var(--gold);}

  main{max-width:820px; margin:0 auto; padding:50px 24px 100px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; margin-bottom:10px;}
  h1{font-family:'Cinzel',serif; font-size:32px; margin-bottom:10px;}
  .sub{color:var(--parchment-dim); margin-bottom:36px; max-width:560px; line-height:1.6;}

  #gate{text-align:center; padding:60px 20px;}
  #gate p{color:var(--parchment-dim); margin-bottom:20px;}
  #gate a.cta{display:inline-block; border:1.5px solid var(--gold); color:var(--gold-bright); text-decoration:none; padding:12px 26px; font-family:'Cinzel',serif; letter-spacing:1.5px; font-size:14px; text-transform:uppercase;}

  #app{display:none;}
  #app.active{display:block;}

  .panel{background:var(--panel); border:1px solid var(--line); padding:26px 28px; margin-bottom:30px;}
  .panel h2{font-family:'Cinzel',serif; font-size:18px; margin-bottom:16px; color:var(--gold-bright);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--parchment-dim); margin-bottom:6px;}
  .field select, .field input, .field textarea{
    width:100%; background:#0c0f0a; border:1px solid var(--line); color:var(--parchment); padding:10px 12px; font-family:'Spectral',serif; font-size:14px;
  }
  .field textarea{min-height:100px; resize:vertical;}
  .submit-btn{
    border:1.5px solid var(--gold); background:var(--gold); color:#151109; font-family:'Cinzel',serif;
    font-size:13px; letter-spacing:1.5px; text-transform:uppercase; padding:11px 24px; cursor:pointer; font-weight:700;
  }
  .submit-btn:hover{background:var(--gold-bright);}
  .msg{font-size:13px; margin-top:10px; display:none;}
  .msg.show{display:block;}
  .msg.ok{color:#9ed48a;}
  .msg.err{color:#e8b8b8;}

  .ticket{border:1px solid var(--line); margin-bottom:14px;}
  .ticket-head{
    padding:14px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:var(--panel-2);
  }
  .ticket-head .subj{font-size:14px;}
  .ticket-meta{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--parchment-dim); display:flex; gap:10px; align-items:center;}
  .status-badge{padding:2px 8px; border:1px solid var(--line); text-transform:uppercase; letter-spacing:1px;}
  .status-badge.open{color:var(--gold-bright); border-color:var(--gold);}
  .status-badge.in_progress{color:#8ab4e8; border-color:#3a5a80;}
  .status-badge.closed{color:var(--parchment-dim);}
  .ticket-body{padding:16px 18px; display:none; border-top:1px solid var(--line);}
  .ticket-body.open{display:block;}
  .reply{padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .reply:last-child{border-bottom:none;}
  .reply .who{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--gold); margin-bottom:4px; text-transform:uppercase;}
  .reply-form{display:flex; gap:8px; margin-top:12px;}
  .reply-form textarea{flex:1; min-height:50px;}
  .reply-form button{border:1px solid var(--gold); background:transparent; color:var(--gold-bright); padding:0 18px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase;}

  .empty{color:var(--parchment-dim); font-size:14px; padding:20px 0;}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="brand-mark"></div><div class="brand-name">TLM GAMES</div></div>
  <a class="back" href="index.html">← Retour à la boutique</a>
</header>

<main>
  <div class="eyebrow">Besoin d'aide ?</div>
  <h1>Support</h1>
  <p class="sub">Contacte l'équipe TLM Games : question, bug, demande de vérification de compte, ou contestation d'un bannissement.</p>

  <div id="gate">
    <p>Connecte-toi pour accéder au Support.</p>
    <a class="cta" href="index.html">Se connecter depuis la boutique</a>
  </div>

  <div id="app">
    <div class="panel">
      <h2>Nouvelle demande</h2>
      <div class="field">
        <label>Catégorie</label>
        <select id="new-category">
          <option value="verification">Demande de vérification de compte</option>
          <option value="ban_appeal">Contester un bannissement</option>
          <option value="bug">Signaler un bug</option>
          <option value="content_report">Signaler un contenu</option>
          <option value="other">Autre demande</option>
        </select>
      </div>
      <div class="field">
        <label>Objet</label>
        <input type="text" id="new-subject" placeholder="Résume ta demande en quelques mots">
      </div>
      <div class="field">
        <label>Message</label>
        <textarea id="new-message" placeholder="Explique ta demande en détail..."></textarea>
      </div>
      <button class="submit-btn" id="new-submit">Envoyer au Support</button>
      <div class="msg" id="new-msg"></div>
    </div>

    <div class="panel">
      <h2>Mes demandes</h2>
      <div id="ticket-list"></div>
    </div>
  </div>
</main>

<script>
  const TOKEN_KEY = "tlmgames.token";
  function getToken(){ return localStorage.getItem(TOKEN_KEY); }
  async function api(path, opts = {}){
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    const token = getToken();
    if(token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch("/api" + path, Object.assign({}, opts, { headers }));
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw new Error((data && data.error) || "Erreur serveur.");
    return data;
  }

  const CATEGORY_LABELS = {
    verification: "Vérification de compte",
    ban_appeal: "Contestation de bannissement",
    bug: "Bug",
    content_report: "Signalement de contenu",
    other: "Autre"
  };
  const STATUS_LABELS = { open: "Ouvert", in_progress: "En cours", closed: "Fermé" };

  async function boot(){
    const token = getToken();
    if(!token){ return; }
    try{
      await api("/auth/me");
    }catch(e){ return; }
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").classList.add("active");
    await loadTickets();
  }

  document.getElementById("new-submit").addEventListener("click", async () => {
    const msgBox = document.getElementById("new-msg");
    msgBox.className = "msg";
    const category = document.getElementById("new-category").value;
    const subject = document.getElementById("new-subject").value.trim();
    const message = document.getElementById("new-message").value.trim();
    if(!subject || !message){
      msgBox.textContent = "Merci de remplir l'objet et le message.";
      msgBox.className = "msg show err";
      return;
    }
    try{
      await api("/support/tickets", { method: "POST", body: JSON.stringify({ category, subject, message }) });
      document.getElementById("new-subject").value = "";
      document.getElementById("new-message").value = "";
      msgBox.textContent = "✓ Demande envoyée, l'équipe te répondra ici.";
      msgBox.className = "msg show ok";
      await loadTickets();
    }catch(e){
      msgBox.textContent = e.message;
      msgBox.className = "msg show err";
    }
  });

  async function loadTickets(){
    const data = await api("/support/tickets");
    const list = document.getElementById("ticket-list");
    if(data.tickets.length === 0){
      list.innerHTML = `<div class="empty">Aucune demande envoyée pour l'instant.</div>`;
      return;
    }
    list.innerHTML = "";
    data.tickets.forEach(t => {
      const el = document.createElement("div");
      el.className = "ticket";
      el.innerHTML = `
        <div class="ticket-head">
          <span class="subj">${escapeHtml(t.subject)}</span>
          <span class="ticket-meta">
            ${CATEGORY_LABELS[t.category] || t.category}
            <span class="status-badge ${t.status}">${STATUS_LABELS[t.status] || t.status}</span>
          </span>
        </div>
        <div class="ticket-body">
          ${t.replies.map(r => `
            <div class="reply">
              <div class="who">${r.authorRole === 'user' ? 'Toi' : (r.authorRole === 'admin' ? 'Administration' : 'Modération')} — ${new Date(r.createdAt).toLocaleString('fr-FR')}</div>
              <div>${escapeHtml(r.message)}</div>
            </div>`).join("")}
          <div class="reply-form">
            <textarea placeholder="Répondre..."></textarea>
            <button>Envoyer</button>
          </div>
        </div>`;
      const head = el.querySelector(".ticket-head");
      const body = el.querySelector(".ticket-body");
      head.addEventListener("click", () => body.classList.toggle("open"));
      const btn = el.querySelector(".reply-form button");
      const textarea = el.querySelector(".reply-form textarea");
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const message = textarea.value.trim();
        if(!message) return;
        try{
          await api("/support/tickets/" + t.id + "/reply", { method: "POST", body: JSON.stringify({ message }) });
          await loadTickets();
        }catch(err){ alert(err.message); }
      });
      list.appendChild(el);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  boot();
</script>
</body>
</html>
